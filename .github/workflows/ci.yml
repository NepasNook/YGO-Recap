name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm test

      # `npm run lint` is not gated yet: Prettier passes, but the route
      # components still carry ~45 `any`s from the generated Supabase types.
      # Run it locally and re-enable here once those are typed.
